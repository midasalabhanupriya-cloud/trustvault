<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Register' if mode == 'register' else 'Login' }} - TrustVault</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>TrustVault</h1>
        <h2>{{ 'Create an account' if mode == 'register' else 'Login' }}</h2>

        <form method="POST">
            {% if mode == 'register' %}
                <label for="username">Username</label>
                <input id="username" name="username" required>
            {% endif %}

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">
                {{ 'Register' if mode == 'register' else 'Login' }}
            </button>
        </form>

        {% if mode == 'register' %}
            <p>Already registered? <a href="{{ url_for('login') }}">Login</a></p>
        {% else %}
            <p>New user? <a href="{{ url_for('register') }}">Create an account</a></p>
        {% endif %}
    </main>
</body>
</html>
